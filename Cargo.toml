[package]
name = "boom-catalogs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
async-channel = "2.5.0"
clap = { version = "4", features = ["derive", "env"] }
csv = "1.3.1"
fitsio = "0.21.7"
fitsio-derive = "0.2.1"
flate2 = "1.1.5"
indicatif = "0.18.0"
mongodb = "3.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["full"] }
polars = { version = "0.51.0", features = ["lazy", "parquet", "dtype-u8", "dtype-u16", "serde"] }
walkdir = "2.5.0"
serde_with = "3.16.0"
